{% extends 'core/base.html' %}

{% block title %}PRATHAMIKTA - Full GIS Map{% endblock %}
{% block nav_fullmap %}active{% endblock %}

{% block content %}
<div class="view active" id="view-fullmap">
  <div style="padding: 12px; height: 100%;">
    <div class="fullpage-card" style="border-radius: 8px; position: relative;">
      <div style="position: absolute; top: 12px; right: 12px; z-index: 1000; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 4px 8px; display: flex; gap: 8px; font-size: 11px;">
        <label style="cursor: pointer; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); padding: 3px 8px; border-radius: 4px; color: #fca5a5; display: flex; align-items: center; gap: 4px;">
          <input type="checkbox" id="fm-toggle-vuln-heatmap" onchange="toggleFullMapVulnerabilityHeatmap(this.checked)"> 🔥 Vulnerability Heatmap
        </label>
      </div>
      <div id="fullmap" style="width: 100%; height: 100%; min-height: 500px;"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let fullmap = null;
  let fullMapNearbyAidLayer = null;
  let fmVulnLayer = null;
  let fmLayerData = null;

  document.addEventListener('DOMContentLoaded', () => {
    initFullMap();
    fetchIncidents();
    loadFullMapGISData();
  });

  function initFullMap() {
    fullmap = L.map('fullmap', { center: [28.1, 84.4], zoom: 7, zoomControl: true, attributionControl: false });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(fullmap);
    fullMapNearbyAidLayer = L.layerGroup().addTo(fullmap);
  }

  async function loadFullMapGISData() {
    try {
      const response = await fetch('/api/map/vulnerability-layers/');
      const data = await response.json();
      if (data.success) fmLayerData = data;
    } catch (err) { console.error(err); }
  }

  function toggleFullMapVulnerabilityHeatmap(enabled) {
    if (!fullmap) return;
    if (!fmVulnLayer) fmVulnLayer = L.layerGroup().addTo(fullmap);
    fmVulnLayer.clearLayers();
    if (!enabled || !fmLayerData) return;

    fmLayerData.districtHeatmap.forEach(dist => {
      const circle = L.circle([dist.lat, dist.lng], {
        radius: dist.radius,
        fillColor: dist.color,
        color: dist.color,
        weight: 1,
        fillOpacity: 0.35
      }).addTo(fmVulnLayer);

      circle.bindPopup(`
        <div style="font-size: 11px; line-height: 1.4;">
          <strong style="color: ${dist.color}; font-size: 12px;">🔥 ${dist.name} District (${dist.nameNep})</strong><br/>
          <strong>Vulnerability Index:</strong> ${dist.vulnerability}/10<br/>
          <strong>Primary Hazards:</strong> ${dist.riskType}<br/>
          <strong>Population at Risk:</strong> ${dist.population.toLocaleString()}<br/>
          <strong>Province:</strong> ${dist.province}
        </div>
      `);
    });
  }



  async function fetchIncidents() {
    try {
      const response = await fetch('/api/incidents/');
      const data = await response.json();
      const rawIncidents = data.incidents || [];
      incidents = rawIncidents.filter(i => !['resolved', 'dismissed', 'completed', 'complete', 'closed'].includes((i.status || '').toLowerCase()));


      updateAlertCount(incidents.length);
      renderFullMapMarkers();
    } catch (err) {
      console.error(err);
    }
  }

  function renderFullMapMarkers() {
    if (!fullmap) return;

    fullmap.eachLayer(layer => {
      if (layer instanceof L.CircleMarker) layer.remove();
    });

    incidents.forEach(inc => {
      const score = inc.manualPriority !== null ? inc.manualPriority : Math.round(inc.triageScore);
      let color = '#10b981';
      if (score >= 85) color = '#ef4444';
      else if (score >= 65) color = '#f97316';
      else if (score >= 45) color = '#eab308';

      const locName = cleanLocation(inc.locationName, inc.districtId);

      const marker = L.circleMarker([inc.lat, inc.lng], {
        radius: 10,
        fillColor: color,
        color: '#fff',
        weight: 2,
        fillOpacity: 0.9
      }).addTo(fullmap);

      marker.bindPopup(`
        <div style="font-size: 12px; line-height: 1.5;">
          <strong>${inc.disasterType}</strong><br/>
          📍 ${locName}<br/>
          Priority Score: <strong>${score}/100</strong><br/>
          Status: ${inc.status === 'rescuers_arrived' ? '🚑 On-Site' : '⏳ Dispatched'}
        </div>
      `);
    });
  }
</script>
{% endblock %}
